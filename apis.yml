aid: light
name: Light
description: >-
  Light is an agentic accounting and financial-operations platform positioned as an alternative
  to traditional ERPs and fragmented finance stacks. It combines a multi-entity general ledger
  and consolidation engine with accounts payable, accounts receivable, spend management and
  corporate cards, contracts and subscription billing, purchase orders and expense
  reimbursement. The Light API is a REST API over HTTPS returning camelCase JSON, covering 183
  operations across 28 resource groups — invoice payables and receivables, credit notes,
  customer credits, journal entries, ledger accounts, bank accounts and transactions, cards and
  card transactions, contracts, purchase orders, products, vendors, customers and users.
  Authentication is either an API key sent as HTTP Basic or an OAuth 2.0 access token, access is
  governed by the same roles as user accounts, and writes on 14 operations accept an
  X-Idempotency-Key header. Light also publishes a live Model Context Protocol server over its
  documentation and markets a Claude MCP integration against the live ledger.
