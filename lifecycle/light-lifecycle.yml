  policy: non-exhaustive-enums
  statement: >-
    Enum values are fully documented but not guaranteed to be exhaustive. New enum values may
    be introduced over time as the system evolves. Consumers must handle unexpected or unknown
    enum values gracefully, avoid assuming the list is complete or immutable, and prefer
    string-based comparisons or a safe fallback over exhaustive matching. This policy allows
    Light to extend functionality without introducing breaking changes for consumers who
    implement robust handling.
