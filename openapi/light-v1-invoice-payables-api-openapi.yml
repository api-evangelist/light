        payeeBankAddress:
          type:
          - string
          - 'null'
          description: Street address of the payee's bank.
        payeeBankZipcode:
          type:
          - string
          - 'null'
          description: ZIP/postal code of the payee's bank.
        payeeCity:
          type:
          - string
          - 'null'
          description: City of the payee.
        payeeBankCity:
          type:
          - string
          - 'null'
          description: City of the payee's bank.
        vendorId:
          type:
          - string
          - 'null'
          description: ID of the vendor entity this invoice payable is linked to, if any.
          format: uuid
        vendorDetailsOcr:
          $ref: '#/components/schemas/ExternalInvoicePayableVendorDetailsOcrV1Model'
        companyEntityId:
          type:
          - string
          - 'null'
          description: ID of the company entity this invoice payable is booked under.
          format: uuid
        invoiceNumber:
          type:
          - string
          - 'null'
          description: Invoice number provided on the vendor invoice.
        amount:
          type:
          - integer
          - 'null'
          description: Total invoice amount in cents, expressed in the invoice currency.
          format: int64
        outstandingBalance:
          type:
          - integer
          - 'null'
          description: Outstanding invoice balance to be paid in cents, expressed in the invoice currency.
          format: int64
        currency:
          type: string
          example: USD
        description:
          type:
          - string
          - 'null'
          description: Description or memo for the invoice payable.
        senderBankAccountId:
          type:
          - string
          - 'null'
          description: ID of the sender bank account from which this invoice payable will be paid.
          format: uuid
        fiNumber:
          type:
          - string
          - 'null'
          description: FI (Finnish reference) number associated with this invoice payable, if applicable.
        norKidReference:
          type:
          - string
          - 'null'
          description: Norwegian KID reference associated with this invoice payable, if applicable.
        swissPaymentReference:
          type:
          - string
          - 'null'
          description: Swiss payment reference (QR-Reference or Creditor Reference/SCOR) associated with this invoice payable, if applicable.
        paymentAt:
          type:
          - string
          - 'null'
          description: Date/time when payment is scheduled or was executed for this invoice payable.
          format: date-time
        ocrCompletedAt:
          type:
          - string
          - 'null'
          description: Timestamp when OCR processing for this invoice payable was completed.
          format: date-time
        canceledAt:
          type:
          - string
          - 'null'
          description: Timestamp when this invoice payable was cancelled.
          format: date-time
        issuedDate:
          type:
          - string
          - 'null'
          description: Issue date of the original vendor invoice.
          format: date
        dueDate:
          type:
          - string
          - 'null'
          description: Payment due date of the invoice payable.
          format: date
        invoiceCreatedAt:
          type: string
          description: Timestamp when the invoice payable record was created.
          format: date-time
        updatedAt:
          type: string
          description: Timestamp when the invoice payable record was last updated.
          format: date-time
        purchaseOrderId:
          type:
          - string
          - 'null'
          description: ID of the purchase order linked to this invoice payable, if any.
          format: uuid
        lineItemsIncludeTax:
          type: boolean
          description: Whether invoice line item amounts are entered as tax-inclusive. When true, line item `amount` is expected to be the gross amount including tax; when false, line item `netAmount` is expected to be the base amount excluding tax.
        localCurrencyFxRate:
          type:
          - number
          - 'null'
          description: Foreign exchange rate to the ledger's local currency. If null, the system uses its default FX source.
        groupCurrencyFxRate:
          type:
          - number
          - 'null'
          description: Foreign exchange rate to the ledger's group currency. If null, the system uses its default FX source.
        lineItems:
          type:
          - array
          - 'null'
          description: List of line items belonging to this invoice payable.
          items:
            $ref: '#/components/schemas/ExternalInvoicePayableLineItemV1Model'
        customProperties:
          type:
          - array
          - 'null'
          description: Custom properties set on the invoice payable header.
          items:
            $ref: '#/components/schemas/ExternalCustomPropertyV1Model'
        paymentPausedBy:
          type:
          - string
          - 'null'
          description: ID of the user who paused payment for this invoice payable, if payment is paused.
          format: uuid
        paymentPausedAt:
          type:
          - string
          - 'null'
          description: Timestamp when payment for this invoice payable was paused, if applicable.
          format: date-time
        senderEmail:
          type:
          - string
          - 'null'
          description: Email address from which the invoice payable was received, if known.
        documentName:
          type:
          - string
          - 'null'
          description: Name of the original document file associated with this invoice payable.
