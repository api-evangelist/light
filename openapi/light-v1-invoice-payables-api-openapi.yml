      type: object
      properties:
        clearingAccountingDocumentId:
          type: string
          description: ID of the clearing accounting document to reverse — the bank payment or credit note that was applied to this invoice payable. Obtain it from the `accountingDocumentId` of an entry returned by the `List invoice payable payments` endpoint.
          format: uuid
        clearingType:
          type: string
          description: 'Type of the clearing being reversed: `BP` for a bank payment or `CN` for a credit note. Matches the `type` of the corresponding entry returned by the `List invoice payable payments` endpoint.


            - `BP` - Bank payment

            - `CN` - Credit note


            ⚠️ This enum is not exhaustive; new values may be added in the future.'
          deprecated: false
          enum:
          - BP
          - CN
        shouldArchiveClearingDocument:
          type: boolean
          description: Whether to also archive the underlying clearing document (bank payment or credit note) after reversing it.
          default: false
