        invoicePayableId:
          type: string
          description: ID of the invoice payable this payment cleared
          format: uuid
        amount:
          type: integer
          description: Payment amount in the smallest currency denomination (e.g. cents), in the invoice payable's currency
          format: int64
        currency:
          type: string
