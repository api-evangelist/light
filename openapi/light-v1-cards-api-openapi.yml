          format: int64
        currency:
          type: string
          example: USD
        interval:
          type: string
          description: 'Interval for the spending limit (PER_TRANSACTION, WEEKLY, or MONTHLY).


            ⚠️ This enum is not exhaustive; new values may be added in the future.'
          nullable: false
          deprecated: false
          enum:
          - PER_TRANSACTION
          - WEEKLY
          - MONTHLY
      description: Optional spending limits for this card.
      nullable: true
