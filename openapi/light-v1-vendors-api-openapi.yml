        bankCity:
          type:
          - string
          - 'null'
          description: Vendor bank city.
        bankAddress:
          type:
          - string
          - 'null'
          description: Vendor bank address.
        bankZipcode:
          type:
          - string
          - 'null'
          description: Vendor bank ZIP/postal code.
        bankAccountNumber:
          type:
          - string
          - 'null'
          description: Vendor bank account number (IBAN or local format).
        bankAccountBic:
          type:
          - string
          - 'null'
          description: Vendor bank BIC/SWIFT code.
        domesticBankAccountNumber:
          type:
          - string
          - 'null'
          description: Vendor domestic bank account number (country-specific format).
        domesticBankAccountCode:
          type:
          - string
          - 'null'
          description: Vendor domestic bank account code (e.g. routing/sort code).
        swedishBankgiroNumber:
          type:
          - string
          - 'null'
          description: Vendor Swedish Bankgiro number, if applicable.
        swedishPlusgiroNumber:
          type:
          - string
          - 'null'
          description: Vendor Swedish Plusgiro number, if applicable.
        bankRecipientName:
          type:
          - string
          - 'null'
          description: Name of the bank account holder. When set, this overrides the vendor name on the payment recipient for providers that consult it (currently Airwallex).
        currency:
          type:
          - string
          - 'null'
          example: USD
        customProperties:
          type:
          - array
          - 'null'
          description: List of custom properties to set on the vendor.
          items:
            $ref: '#/components/schemas/SetCustomPropertyRequestV1Model'
    ExternalSetCustomPropertyRequestV1Model:
      type:
      - object
      - 'null'
      properties:
        groupId:
          type: string
          description: ID of the custom property group.
          format: uuid
        valueIds:
          type: array
          description: IDs of the selected custom property values. It behaves as a PUT operation, so if empty the existing ones will be effectively deleted.
          items:
            type: string
            description: IDs of the selected custom property values. It behaves as a PUT operation, so if empty the existing ones will be effectively deleted.
            format: uuid
        inlineValues:
          type:
          - array
          - 'null'
          description: Inline custom property values (used for TEXT/NUMERIC/DATE/etc. groups). It behaves as a PUT operation, so if empty or null the existing ones will be effectively deleted.
          items:
            type:
            - string
            - 'null'
            description: Inline custom property values (used for TEXT/NUMERIC/DATE/etc. groups). It behaves as a PUT operation, so if empty or null the existing ones will be effectively deleted.
      description: List of custom properties to set on the vendor. Replaces the existing set.
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: Basic authentication header of the form **Basic** **<api_key>**, where **<api_key>** is your api key.
      name: Authorization
      in: header
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
