    ExternalCreateBankLedgerAccountRequestV1Model:
      required:
      - code
      type: object
      properties:
        code:
          type: integer
          description: Ledger account code. Must be a unique 6-digit integer within the company's chart of accounts.
          format: int32
        label:
          type: string
          description: Ledger account label. Defaults to the bank name when omitted.
          nullable: true
      description: Ledger account (chart of accounts entry) created and linked to this bank account.
