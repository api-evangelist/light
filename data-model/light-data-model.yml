posting_model:
  description: >-
    The recurring lifecycle across Light's document types is draft -> post -> clear/reverse.
    Documents are editable while in draft, become immutable once posted to the ledger, and are
    unwound by an explicit reset/reverse operation that writes reversing ledger entries rather
    than deleting history.
  reset_operations: [resetContract, resetInvoiceReceivable, resetCardTransaction, resetPurchaseOrder, reverseInvoicePayableClearing]
